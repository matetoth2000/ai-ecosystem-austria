database:
  path: db/ai_ecosystem.sqlite

ingestion:
  orbis_aurelia_input_path: data/raw/orbis_aurelia/INPUT_FILE_HERE.txt

acquisition:
  fetch_scope: discovered
  timeout_seconds: 15
  retry_count: 2
  max_workers: 20
  skip_existing: true
  force_refresh: false
  progress_log_every_n_pages: 25

extraction:
  extraction_version: v1
  output_root: data/extracted
  markdown_directory: markdown
  text_directory: text
  overwrite_existing: false

scoring:
  scoring_profile_id: content_scoring_default
  scoring_profile_version: v1
  knowledge_base_directory: config/knowledge_bases
  required_dimensions:
    - firm_profile
    - technology
    - innovation
    - ecosystem
  dimension_weights:
    firm_profile: 1.0
    technology: 1.0
    innovation: 1.0
    ecosystem: 1.0
  field_weights:
    title: 2.0
    headings: 1.5
    markdown: 1.0
    plain_text: 1.0
    url: 0.5
    internal_anchor_text: 0.5
    external_anchor_text: 0.25
  fusion_weights:
    query: 1.0
    keyword: 1.0
    boost: 0.5
    negative: -1.0

validation:
  enabled: false
  model: gpt-5-mini
  temperature: 0
  max_input_chars: 4000
  smoke_sample_size_per_group: 5
  main_sample_size_per_group: 300
  max_pages_per_domain: 3
  prompt_version: v2
  random_seed: 20260608
  retry_count: 2
  request_timeout_seconds: 60

discovery:
  pilot_domain_limit: 100
  max_workers: 20

  pilot_mix:
    single_firm: 90
    shared_domain: 8
    shared_group_or_brand: 2

  max_discovered_urls_per_domain: 200
  max_retained_candidate_urls_per_domain: 20
  retention_audit_enabled: false

  request_timeout_seconds: 15
  user_agent: "AIAustriaResearchBot/0.1"

  sitemap_url_limit: 20
  sitemap_timeout_seconds: 5
  max_sitemap_urls_per_domain: 1000

  homepage_priority: 8
  ai_priority: 10
  products_priority: 6
  careers_priority: 5
  about_priority: 4
  news_priority: 3
  negative_priority: -100

paths:
  raw_orbis_dir: data/raw/orbis_aurelia
  interim_dir: data/interim
  processed_dir: data/processed

versions:
  chunking_version: v0_1
  retrieval_version: v0_1
  prompt_version: v0_1
  model_run_version: v0_1
