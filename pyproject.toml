[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ecosystem-austria"
version = "0.1.0"
description = "Mapping the Austrian AI Ecosystem Using Web Data and NLP"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]
