[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ecosystem-austria"
version = "0.1.0"
description = "Mapping the Austrian AI Ecosystem Using Web Data and NLP"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "openai",
    "pyyaml",
    "requests",
    "trafilatura",
]

[project.optional-dependencies]
analysis = [
    "ipykernel>=6,<7",
    "jupyterlab>=4,<5",
    "matplotlib>=3.9,<4",
    "nbconvert>=7,<8",
    "nbformat>=5,<6",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<21",
    "scikit-learn>=1.5,<2",
    "scipy>=1.14,<2",
    "seaborn>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
